name: 构建打包（Web 预览 + Android APK）

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  web-build:
    name: 构建 Web 预览产物
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: NovelFlow-Web-Dist
          path: dist

  android-apk:
    name: 构建 Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Gradle 打包 Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
      - name: 重命名 APK
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk out/NovelFlow-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: NovelFlow-Android-APK
          path: out/NovelFlow-debug.apk
          if-no-files-found: error

  release-apk:
    name: 发布 Release（打 v* 标签时自动）
    if: startsWith(github.ref, 'refs/tags/v')
    needs: android-apk
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: NovelFlow-Android-APK
          path: out
      - uses: softprops/action-gh-release@v2
        with:
          files: out/NovelFlow-debug.apk
